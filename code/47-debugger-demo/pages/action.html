<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>chrome.debugger 展示</title>
    <style>
        body { width: 420px; font-family: system-ui, sans-serif; padding: 8px; }
        button { margin: 2px; }
        pre { background: #f5f5f5; padding: 8px; max-height: 220px; overflow: auto; }
        label { display: block; margin-top: 6px; }
    </style>
</head>

<body>
    <h1>chrome.debugger</h1>

    <h3>附加 / 分离</h3>
    <button id="attach">附加到当前标签页</button>
    <button id="detach">分离</button>
    <button id="targets">获取可附加目标</button>

    <h3>发送 CDP 命令</h3>
    <label>CDP 方法：<input id="method" value="Runtime.evaluate"></label>
    <label>参数(JSON)：<input id="params" value='{"expression":"document.title"}'></label>
    <button id="send">发送命令</button>

    <h3>结果</h3>
    <pre id="result">等待操作...</pre>

    <script src="../js/action.js"></script>
</body>

</html>
